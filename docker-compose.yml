# Runs the bot and an HTTPS front end (Caddy) on one small VPS (1-2 GB RAM).
#   cp .env.example .env        (set DOMAIN, the WA_* values, ANTHROPIC_API_KEY, MANAGER_NUMBERS, ODOO_*)
#   docker compose up -d
#   docker compose logs -f bot
# Point DOMAIN's DNS (an A record) at the VPS first: Caddy gets a free HTTPS certificate for it automatically.
#
# Optional extras, each started with a profile:
#   Voice notes (Whisper, needs ~3 GB more RAM): set STT_URL=http://stt:8000 in .env, then
#     docker compose --profile voice up -d
#   Local model instead of Claude: set LLM_PROVIDER=ollama, then
#     docker compose --profile ollama up -d
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    command: ["caddy", "reverse-proxy", "--from", "${DOMAIN:?set DOMAIN in .env}", "--to", "bot:3000"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy:/data
    depends_on:
      - bot

  # Whisper speech-to-text for voice notes (OpenAI-compatible API). Downloads its model (~1.6 GB) on first use.
  # The default model (large-v3-turbo) needs about 2-3 GB of RAM.
  stt:
    profiles: [voice]
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    restart: unless-stopped
    volumes:
      - stt:/home/ubuntu/.cache/huggingface

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      OLLAMA_URL: http://ollama:11434
      PORT: "3000"
    volumes:
      - data:/data
    depends_on:
      stt:
        condition: service_started
        required: false
      ollama-pull:
        condition: service_completed_successfully
        required: false

  ollama:
    profiles: [ollama]
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      retries: 30

  # Downloads the model once (a few GB), then exits.
  ollama-pull:
    profiles: [ollama]
    image: ollama/ollama:latest
    env_file: .env
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["sh", "-c", "ollama pull \"$${OLLAMA_MODEL:-qwen3:4b}\""]
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  caddy:
  stt:
  ollama:
  data:
