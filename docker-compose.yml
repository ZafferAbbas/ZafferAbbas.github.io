# Runs the bot, a local Ollama model server and an HTTPS front end (Caddy) on one VPS.
#   cp .env.example .env        (set DOMAIN, TIMEZONE, BOT_NAME, OLLAMA_MODEL and the WA_* values)
#   docker compose up -d
#   docker compose logs -f bot
# Point DOMAIN's DNS (an A record) at the VPS first: Caddy gets a free HTTPS certificate for it automatically.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    command: ["caddy", "reverse-proxy", "--from", "${DOMAIN:?set DOMAIN in .env}", "--to", "bot:3000"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy:/data
    depends_on:
      - bot

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      retries: 30

  # Downloads the model once (a few GB), then exits.
  ollama-pull:
    image: ollama/ollama:latest
    env_file: .env
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["sh", "-c", "ollama pull \"$${OLLAMA_MODEL:-qwen3:4b}\""]
    depends_on:
      ollama:
        condition: service_healthy

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      LLM_PROVIDER: ollama
      OLLAMA_URL: http://ollama:11434
      PORT: "3000"
    volumes:
      - data:/data
    depends_on:
      ollama-pull:
        condition: service_completed_successfully

volumes:
  caddy:
  ollama:
  data:
